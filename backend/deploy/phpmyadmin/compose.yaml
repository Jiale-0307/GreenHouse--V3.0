services:
  phpmyadmin:
    # 服务器离线导入时在.env中填写已校验的image ID，避免标签漂移。
    image: ${PHPMYADMIN_IMAGE:-phpmyadmin:5.2.3-apache}
    pull_policy: never
    container_name: zfxzg-phpmyadmin
    restart: unless-stopped
    ports:
      # 仅允许服务器本机/SSH隧道访问；不直接开放公网管理端口。
      - "127.0.0.1:9081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_ABSOLUTE_URI: http://127.0.0.1:9081/
      UPLOAD_LIMIT: 32M
      MEMORY_LIMIT: 96M
      MAX_EXECUTION_TIME: "120"
      TZ: Asia/Shanghai
    volumes:
      - ./config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
      - ./apache-limits.conf:/etc/apache2/conf-enabled/zz-zfxzg-limits.conf:ro
      - ./php-limits.ini:/usr/local/etc/php/conf.d/zz-zfxzg-limits.ini:ro
    secrets:
      - phpmyadmin_blowfish
    networks:
      - mysql_network
    mem_limit: 192m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mysql_network:
    external: true
    name: 1panel-network

secrets:
  phpmyadmin_blowfish:
    file: ./secrets/blowfish_secret
